<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>잔반량 관리 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
        .chart-container { position: relative; height: 300px; width: 100%; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-radius: 1rem; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- Header Section -->
    <header class="max-w-7xl mx-auto mb-8 flex flex-col md:flex-row justify-between items-center bg-indigo-600 text-white p-6 rounded-2xl shadow-lg">
        <div>
            <h1 class="text-2xl font-bold">🍱 잔반 제로(Zero) 실시간 대시보드</h1>
            <p class="text-indigo-100 opacity-90 mt-1">학생별 잔반 배출 현황 및 통계 분석 시스템</p>
        </div>
        <div class="mt-4 md:mt-0 text-right">
            <p class="text-sm font-semibold bg-white/20 px-4 py-2 rounded-full inline-block">

            </p>
        </div>
    </header>

    <main class="max-w-7xl mx-auto space-y-8">

        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">

                <p class="text-gray-500 text-sm">전체 학생 수</p>
                <h3 class="text-3xl font-bold text-gray-800" id="totalStudents">0명</h3>
            </div>
            <div class="glass-card p-6 border-l-4 border-emerald-500">
                <p class="text-gray-500 text-sm">누적 총 잔반량</p>
                <h3 class="text-3xl font-bold text-gray-800" id="totalWaste">0g</h3>
            </div>
            <div class="glass-card p-6 border-l-4 border-amber-500">
                <p class="text-gray-500 text-sm">월 평균 잔반량</p>
                <h3 class="text-3xl font-bold text-gray-800" id="avgWaste">0g</h3>
            </div>
            <div class="glass-card p-6 border-l-4 border-rose-500">
                <p class="text-gray-500 text-sm">노력 필요 학생</p>
                <h3 class="text-3xl font-bold text-gray-800" id="needsWork">0명</h3>
            </div>
        </div>

        <!-- Charts Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- 1. 월별 총 잔반양 추이 -->
            <div class="glass-card p-6">
                <h2 class="text-lg font-bold mb-4 flex items-center">
                    <span class="w-2 h-6 bg-indigo-500 rounded mr-2"></span>월별 총 잔반량 추이
                </h2>
                <div class="chart-container">
                    <canvas id="monthlyTrendChart"></canvas>
                </div>
            </div>

            <!-- 2. 등급별 현황 분포 -->
            <div class="glass-card p-6">
                <h2 class="text-lg font-bold mb-4 flex items-center">
                    <span class="w-2 h-6 bg-emerald-500 rounded mr-2"></span>학생 등급 분포 현황
                </h2>
                <div class="chart-container">
                    <canvas id="gradeDistributionChart"></canvas>
                </div>
            </div>

            <!-- 3. 학생별 누적 잔반량 TOP 10 -->
            <div class="glass-card p-6 lg:col-span-2">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold flex items-center">
                        <span class="w-2 h-6 bg-amber-500 rounded mr-2"></span>학생별 누적 잔반량 현황
                    </h2>
                    <select id="sortOrder" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 p-2" onchange="updateIndividualChart()">
                        <option value="desc">잔반 많은 순</option>
                        <option value="asc">잔반 적은 순</option>
                    </select>
                </div>
                <div class="chart-container" style="height: 400px;">
                    <canvas id="individualWasteChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Data Table -->
        <div class="glass-card p-6 overflow-x-auto">
            <h2 class="text-lg font-bold mb-4 flex items-center">
                <span class="w-2 h-6 bg-slate-500 rounded mr-2"></span>학생별 상세 데이터 목록
            </h2>
            <table class="w-full text-sm text-left text-gray-500">
                <thead class="text-xs text-gray-700 uppercase bg-gray-50">
                    <tr>
                        <th class="px-6 py-3">이름</th>
                        <th class="px-6 py-3">학급</th>
                        <th class="px-6 py-3 text-center">3월</th>
                        <th class="px-6 py-3 text-center">4월</th>
                        <th class="px-6 py-3 text-center">5월</th>
                        <th class="px-6 py-3 text-center">6월</th>
                        <th class="px-6 py-3 text-center">누적 합계</th>
                        <th class="px-6 py-3 text-center">등급</th>
                    </tr>
                </thead>
                <tbody id="dataTableBody">
                    <!-- Loaded via JavaScript -->
                </tbody>
            </table>
        </div>
    </main>

        let students = rawData.map(row => ({
            name: row[0],
            group: row[1],
            mar: parseInt(row[2]),
            apr: parseInt(row[3]),
            may: parseInt(row[4]),
            jun: parseInt(row[5]),
            total: parseInt(row[2]) + parseInt(row[3]) + parseInt(row[4]) + parseInt(row[5]),
            grade: row[6]
        }));

        // --- Charts Initialization ---
        let indChart;

        function initDashboard() {
            // Stats Update
            document.getElementById('totalStudents').innerText = students.length + '명';
            const totalSum = students.reduce((acc, s) => acc + s.total, 0);
            document.getElementById('totalWaste').innerText = totalSum.toLocaleString() + 'g';
            document.getElementById('avgWaste').innerText = Math.round(totalSum / 4).toLocaleString() + 'g';
            document.getElementById('needsWork').innerText = students.filter(s => s.grade === '노력하기').length + '명';

            renderMonthlyChart();
            renderGradeChart();
            renderIndividualChart();
            renderTable();
        }

        function renderMonthlyChart() {
            const ctx = document.getElementById('monthlyTrendChart').getContext('2d');
            const monthlySums = {
                '3월': students.reduce((acc, s) => acc + s.mar, 0),
                '4월': students.reduce((acc, s) => acc + s.apr, 0),
                '5월': students.reduce((acc, s) => acc + s.may, 0),
                '6월': students.reduce((acc, s) => acc + s.jun, 0),
            };

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: Object.keys(monthlySums),
                    datasets: [{
                        label: '월별 총 잔반양(g)',
                        data: Object.values(monthlySums),
                        borderColor: '#4f46e5',
                        backgroundColor: 'rgba(79, 70, 229, 0.1)',
                        fill: true,
                        tension: 0.4,
                        borderWidth: 3,
                        pointRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } }
                }
            });
        }

        function renderGradeChart() {
            const ctx = document.getElementById('gradeDistributionChart').getContext('2d');
            const grades = { '매우우수': 0, '우수': 0, '보통': 0, '노력하기': 0 };
            students.forEach(s => grades[s.grade]++);

            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(grades),
                    datasets: [{
                        data: Object.values(grades),
                        backgroundColor: ['#10b981', '#34d399', '#fbbf24', '#f43f5e'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '70%',
                    plugins: { legend: { position: 'right' } }
                }
            });
        }

        function renderIndividualChart() {
            const ctx = document.getElementById('individualWasteChart').getContext('2d');
            const order = document.getElementById('sortOrder').value;
            
            const sorted = [...students].sort((a, b) => order === 'desc' ? b.total - a.total : a.total - b.total).slice(0, 15);

            indChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: sorted.map(s => s.name),
                    datasets: [{
                        label: '누적 잔반량(g)',
                        data: sorted.map(s => s.total),
                        backgroundColor: sorted.map(s => s.total > 500 ? '#f43f5e' : '#4f46e5'),
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        }

        function updateIndividualChart() {
            if (indChart) indChart.destroy();
            renderIndividualChart();
        }

        function renderTable() {
            const tbody = document.getElementById('dataTableBody');
            tbody.innerHTML = students.map(s => `
                <tr class="bg-white border-b hover:bg-gray-50 transition-colors">
                    <td class="px-6 py-4 font-semibold text-gray-900">${s.name}</td>
                    <td class="px-6 py-4">${s.group}</td>
                    <td class="px-6 py-4 text-center">${s.mar}</td>
                    <td class="px-6 py-4 text-center">${s.apr}</td>
                    <td class="px-6 py-4 text-center">${s.may}</td>
                    <td class="px-6 py-4 text-center">${s.jun}</td>
                    <td class="px-6 py-4 text-center font-bold text-indigo-600">${s.total}g</td>
                    <td class="px-6 py-4 text-center">
                        <span class="px-2 py-1 rounded-full text-xs font-bold ${
                            s.grade === '매우우수' ? 'bg-emerald-100 text-emerald-700' :
                            s.grade === '우수' ? 'bg-green-100 text-green-700' :
                            s.grade === '보통' ? 'bg-amber-100 text-amber-700' : 'bg-rose-100 text-rose-700'
                        }">${s.grade}</span>
                    </td>
                </tr>
            `).join('');
        }

        window.onload = initDashboard;
